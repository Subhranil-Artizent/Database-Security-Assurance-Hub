global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: assurance-hub
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: assurance-hub-api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["api:8000"]
    scrape_timeout: 5s
