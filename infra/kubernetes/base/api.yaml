apiVersion: apps/v1
kind: Deployment
metadata:
  name: assurance-hub-api
  labels:
    app.kubernetes.io/name: assurance-hub-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: assurance-hub-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: assurance-hub-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: assurance-hub-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: assurance-hub-api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: assurance-hub-api
      containers:
        - name: api
          image: ghcr.io/example/assurance-hub-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: assurance-hub-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: assurance-hub-runtime
                  key: database-url
            - name: DATABASE_MAINTENANCE_URL
              valueFrom:
                secretKeyRef:
                  name: assurance-hub-runtime
                  key: database-maintenance-url
            - name: OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: assurance-hub-runtime
                  key: oidc-issuer
            - name: OIDC_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: assurance-hub-runtime
                  key: oidc-audience
            - name: OIDC_JWKS_URL
              valueFrom:
                secretKeyRef:
                  name: assurance-hub-runtime
                  key: oidc-jwks-url
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: assurance-hub-api
  labels:
    app.kubernetes.io/name: assurance-hub-api
    app.kubernetes.io/component: api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8000"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: assurance-hub-api
  ports:
    - name: http
      port: 8000
      targetPort: http
