apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: assurance-hub
spec:
  tls:
    - hosts:
        - assurance-api.example.invalid
      secretName: assurance-hub-tls
  rules:
    - host: assurance-api.example.invalid
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: assurance-hub-api
                port:
                  name: http
