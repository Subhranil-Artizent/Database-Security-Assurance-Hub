apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: collector-outbound-only
spec:
  ingress: []
  egress:
    # TEST-NET ranges are documentation placeholders, not production routes.
    - to:
        - ipBlock:
            cidr: 198.51.100.0/24
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 203.0.113.0/24
      ports:
        - protocol: TCP
          port: 1521
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 5000
        - protocol: TCP
          port: 4100
