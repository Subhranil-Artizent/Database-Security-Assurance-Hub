[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "database-security-assurance-collector"
version = "0.1.0"
description = "Outbound-only database security evidence collector"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.10,<3",
]

[project.optional-dependencies]
postgresql = ["psycopg[binary]>=3.2,<4"]
oracle = ["oracledb>=2.5,<4"]
sybase = ["pyodbc>=5.2,<6"]
mysql = ["mysql-connector-python>=9.0,<27", "python-dotenv>=1.2,<2"]
observability = [
  "prometheus-client>=0.22,<1",
  "opentelemetry-api>=1.37,<2",
  "opentelemetry-sdk>=1.37,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.37,<2",
]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]

[project.scripts]
assurance-collector = "assurance_collector.main:main"
assurance-local-masker = "assurance_collector.local_masker:main"

[tool.hatch.build.targets.wheel]
packages = ["assurance_collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --disable-warnings --basetemp=.pytest-runtime"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
