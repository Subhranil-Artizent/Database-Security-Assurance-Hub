[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "database-security-assurance-api"
version = "0.1.0"
description = "Multi-tenant control plane for database security assurance"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.139.2,<0.140",
  "pydantic>=2.13.4,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.51,<2.1",
  "alembic>=1.16,<2",
  "uvicorn[standard]>=0.35,<1",
  "asyncpg>=0.30,<1",
  "PyJWT[crypto]>=2.10,<3",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
postgres = []
sqlite = ["aiosqlite>=0.21,<1"]
observability = [
  "prometheus-client>=0.22,<1",
  "opentelemetry-api>=1.37,<2",
  "opentelemetry-sdk>=1.37,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.37,<2",
  "opentelemetry-instrumentation-fastapi>=0.58b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.58b0,<1",
]
dev = [
  "aiosqlite>=0.21,<1",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["assurance_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --disable-warnings --basetemp=.pytest-runtime"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["B008", "S101"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
strict = true
warn_unused_ignores = true
